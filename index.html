<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"><title>TrovaPrezzi</title></head><body><header><b>TrovaPrezzi<small>Monitoraggio prezzi</small></b><button id="install">Installa App</button></header><main><section id="home"><div class="hero"><div><h1>I tuoi prodotti</h1><p>Prezzi, obiettivi e storico.</p></div><button id="add">＋ Aggiungi prodotto</button></div><div id="help" class="notice hide"></div><div id="empty" class="empty hide"><h2>Nessun prodotto</h2><button onclick="showAdd()">Aggiungi prodotto</button></div><div id="cards" class="grid"></div></section><section id="formview" class="hide"><button class="link" onclick="showHome()">← Indietro</button><h1>Aggiungi prodotto</h1><form id="form"><label>Nome prodotto<input id="name" required></label><label>URL<input id="url" type="url" required></label><div class="two"><label>Prezzo iniziale (€)<input id="price" type="number" min="0" step=".01" required></label><label>Prezzo obiettivo (€)<input id="target" type="number" min="0" step=".01"></label></div><div class="two"><label>Ora controllo<input id="time" type="time" value="09:00"></label><label>Frequenza<select id="frequency"><option>Ogni giorno</option><option>Giorni feriali</option><option>Una volta a settimana</option></select></label></div><label>Notifica<select id="rule"><option>Quando scende sotto l'obiettivo</option><option>Ogni variazione di prezzo</option><option>Solo se diminuisce</option></select></label><button>Salva prodotto</button></form></section><section id="detailview" class="hide"><button class="link" onclick="showHome()">← Prodotti</button><h1 id="title"></h1><div id="detail"></div></section></main><script src="./app.js"></script></body></html>
