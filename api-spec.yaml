openapi: 3.0.3
info:
  title: Price Watch API
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      summary: Login
  /api/products:
    get:
      summary: Lista prodotti dell'utente
    post:
      summary: Crea monitoraggio
  /api/products/{id}:
    get:
      summary: Dettaglio prodotto
