<!doctype html>
<html lang="it"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Price Watch</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1116;--card:#171c24;--line:#262d38;--tx:#e6e9ee;--mu:#8a94a3;--gold:#e0b44c;--teal:#3cc4b0;--red:#ef6b6b}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:14px 14px 80px;max-width:640px}
h1{font-size:20px;margin:6px 0 10px;color:var(--gold)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button{background:var(--teal);color:#07201c;border:0;border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
button.g{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.r{background:transparent;color:var(--red);border:1px solid var(--red)}
button:disabled{opacity:.5}
input{width:100%;background:#0b0e13;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px;font-size:15px}
input[type=checkbox]{width:auto}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
.mono{font-family:'IBM Plex Mono',monospace}.price{font-size:26px;font-weight:700;color:var(--gold)}
.mu{color:var(--mu);font-size:13px}.dn{color:var(--teal)}.up{color:var(--red)}
a{color:var(--teal)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:92%;max-width:560px;padding:16px}
dialog::backdrop{background:#000a}
.cand{display:block;width:100%;text-align:left;margin-top:6px;background:#0b0e13;color:var(--tx);border:1px solid var(--line);font-weight:400}
</style></head><body>
<h1>Price Watch</h1>
<div id="msg" class="mu"></div>

<h2>Frequenza e notifiche</h2>
<div class="card">
  <div class="row sp"><span>Controllo giornaliero alle</span><input type="time" id="time" style="width:auto"></div>
  <div class="row sp" style="margin-top:10px">
    <label style="margin:0;font-size:15px;color:var(--tx)"><input type="checkbox" id="active"> Attivo</label>
    <button class="g" id="savecfg">Salva</button>
  </div>
  <div class="row" style="margin-top:10px"><button id="pushbtn">Attiva notifiche push</button><button class="g" id="testpush">Test</button></div>
</div>

<h2>Prodotti (<span id="cnt">0</span>/5)</h2>
<div id="list"></div>
<div class="row"><button id="add">+ Aggiungi prodotto</button><button class="g" id="checknow">Controlla ora</button></div>

<h2>Quota API</h2>
<div class="card mu" id="usage"></div>
<button class="g" id="resetkey">Cambia chiave di accesso</button>

<dialog id="dlg">
  <h2 style="margin-top:0" id="dt">Prodotto</h2>
  <label>Nome (marca + modello, es. "Sony WH-1000XM5")</label><input id="f_name">
  <label>EAN (opzionale, sotto il codice a barre)</label>
  <div class="row"><input id="f_ean" class="mono" inputmode="numeric" style="flex:1"><button class="g" id="ident">Cerca</button></div>
  <div id="cands"></div>
  <label>Parole da escludere (virgola, es. max, plus)</label><input id="f_ex">
  <div class="row">
    <div style="flex:1"><label>Prezzo minimo €</label><input id="f_min" inputmode="decimal"></div>
    <div style="flex:1"><label>Prezzo obiettivo €</label><input id="f_tg" inputmode="decimal"></div>
  </div>
  <label style="font-size:14px;color:var(--tx)"><input type="checkbox" id="f_cmp"> Confronta tutti i negozi della scheda prodotto Google (+1 ricerca/giorno, consigliato)</label>
  <label style="font-size:14px;color:var(--tx)"><input type="checkbox" id="f_am"> Cerca anche su Amazon (opzionale, +1 ricerca/giorno)</label>
  <label style="font-size:14px;color:var(--tx)"><input type="checkbox" id="f_web"> Cerca sul web: siti ufficiali (opzionale, +1 ricerca/giorno)</label>
  <label style="font-size:14px;color:var(--tx)"><input type="checkbox" id="f_tr"> Solo negozi noti (Amazon, MediaWorld, Unieuro…)</label>
  <div class="row sp" style="margin-top:14px">
    <button class="r" id="del">Elimina</button>
    <div class="row"><button class="g" id="cancel">Annulla</button><button id="save">Salva</button></div>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u)?esc(u):"#";
const fmt=n=>n==null?"–":"€ "+n.toFixed(2).replace(".",",");
let S=null,editing=null;

async function api(path,body,retried){
  const r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-key":(localStorage.getItem("pw_key")||"").trim()},body:body?JSON.stringify(body):undefined});
  if(r.status===401){
    const k=(prompt(retried?"Chiave errata. Riprova (attenzione a maiuscole e spazi):":"Chiave di accesso (APP_KEY impostata su Netlify):")||"").trim();
    if(!k)throw new Error("Accesso negato: chiave non inserita. Ricarica la pagina.");
    localStorage.setItem("pw_key",k);return api(path,body,true);
  }
  const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j;
}
const msg=t=>$("#msg").textContent=t||"";
async function load(){try{S=await api("state");render();}catch(e){msg(e.message);}}

const fmtD=d=>d.slice(8,10)+"/"+d.slice(5,7);
function chart(h,target){
  if(!h||h.length<2)return h&&h.length===1?'<div class="mu" style="margin-top:6px">Il grafico appare dal secondo controllo</div>':"";
  const W=320,H=140,L=46,R=10,T=10,B=22,v=h.map(x=>x.p),n=v.length,minP=Math.min(...v),mi=v.indexOf(minP);
  let lo=Math.min(minP,target||Infinity),hi=Math.max(...v);const rg=(hi-lo)||1;lo-=rg*.1;hi+=rg*.1;
  const px=i=>L+i/(n-1)*(W-L-R),py=p=>T+(1-(p-lo)/(hi-lo))*(H-T-B),f=x=>x.toFixed(1),lb=x=>x.toFixed(hi-lo<20?2:0);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="margin-top:8px">`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${f(py(minP))}" y2="${f(py(minP))}" stroke="#e0b44c" stroke-dasharray="4 3" opacity=".7"/>`;
  s+=`<text x="${L-4}" y="${f(py(minP)+3)}" text-anchor="end" fill="#e0b44c" font-size="10">${lb(minP)}</text>`;
  s+=`<text x="${L-4}" y="${f(py(Math.max(...v))+3)}" text-anchor="end" fill="#8a94a3" font-size="10">${lb(Math.max(...v))}</text>`;
  if(target){s+=`<line x1="${L}" x2="${W-R}" y1="${f(py(target))}" y2="${f(py(target))}" stroke="#3cc4b0" stroke-dasharray="2 3" opacity=".8"/><text x="${W-R}" y="${f(py(target)-3)}" text-anchor="end" fill="#3cc4b0" font-size="10">obiettivo</text>`;}
  s+=`<polyline fill="none" stroke="#3cc4b0" stroke-width="2" points="${v.map((p,i)=>f(px(i))+","+f(py(p))).join(" ")}"/>`;
  v.forEach((p,i)=>{s+=`<circle cx="${f(px(i))}" cy="${f(py(p))}" r="${i===mi?5:3}" fill="${i===mi?"#e0b44c":"#3cc4b0"}"/>`;});
  s+=`<text x="${L}" y="${H-6}" fill="#8a94a3" font-size="10">${fmtD(h[0].d)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="#8a94a3" font-size="10">${fmtD(h[n-1].d)}</text></svg>`;
  return s;
}

function dropList(r){
  const d=r.dropped||[];
  const c=r.counts||{};
  const diag=`<div class="mu">Trovati ${r.total} (Shopping ${c.shopping??"–"}, Negozi ${c.stores??"–"}, Amazon ${c.amazon??"–"}, Web ${c.web??"–"}) · corrispondenti ${r.found} · offerte valide ${r.offers.length}</div>`+(r.notes||[]).map(n=>`<div class="up">${esc(n)}</div>`).join("");
  if(!d.length)return diag;
  return diag+`<details><summary class="mu">Scartati (${d.length})</summary>`+d.map(x=>`<div class="mu" style="padding:5px 0;border-top:1px solid var(--line)"><div class="row sp"><span>${esc(x.shop)} · ${fmt(x.price)}</span><span class="up">${esc(x.why)}</span></div><div>${esc((x.title||"").slice(0,80))}</div></div>`).join("")+`</details>`;
}

function card(p){
  const r=(S.last?.results||[]).find(x=>x.id===p.id),h=S.hist[p.id]||[];
  let body='<div class="mu">Nessun controllo ancora</div>';
  if(r){
    if(r.error)body=`<div class="up">${esc(r.error)}</div>`;
    else if(!r.best)body=`<div class="mu">Nessuna offerta valida</div>`+dropList(r);
    else{
      const b=r.best,d=r.delta,m=h.length?h.reduce((x,y)=>y.p<x.p?y:x):null;
      let minLine="";
      if(m){minLine=b.price<=m.p?`<div class="dn">🏆 ${r.record?"Nuovo minimo storico":"Al minimo storico"}</div>`
        :`<div class="mu">Minimo storico <b style="color:var(--gold)">${fmt(m.p)}</b> (${fmtD(m.d)}, ${esc(m.s)}) · <span class="up">+${fmt(b.price-m.p)}</span> sopra il minimo</div>`;}
      body=`<div class="price">${fmt(b.price)}</div><div>${esc(b.shop)}${b.trusted?"":" ⚠"} · <a href="${safe(b.link)}" target="_blank" rel="noopener">${b.direct===false?"cerca":"apri"}</a></div>`
      +`<div class="mu">${esc((b.title||"").slice(0,90))}</div>`
      +(d?`<div class="${d<0?"dn":"up"}">${d<0?"▼":"▲"} ${fmt(Math.abs(d))} vs ultimo controllo</div>`:"")
      +minLine+chart(h,p.targetPrice)
      +`<details><summary class="mu">Offerte di oggi (${r.offers.length})</summary>`
      +r.offers.map((o,i)=>`<div class="mu" style="padding:6px 0;border-top:1px solid var(--line)"><div class="row sp"><span>${esc(o.shop)}${o.trusted?"":" ⚠"} <span class="mono">${esc(o.src||"")}</span></span><a href="${safe(o.link)}" target="_blank" rel="noopener">${fmt(o.price)}${o.direct===false?" 🔎":""}</a></div><div class="row sp"><span style="flex:1">${esc((o.title||"").slice(0,70))}</span><button class="r" style="padding:4px 8px;font-size:12px" data-fp="${esc(p.id)}" data-oi="${i}">Falso positivo</button></div></div>`).join("")+`</details>`+dropList(r);
    }
  }
  const hist=h.length?`<details><summary class="mu">Storico (${h.length})</summary>`+[...h].reverse().map(x=>`<div class="row sp mu" style="padding:5px 0;border-top:1px solid var(--line)"><span>${fmtD(x.d)} · ${fmt(x.p)} · ${esc(x.s)}</span><button class="r" style="padding:3px 8px;font-size:12px" data-hp="${esc(p.id)}" data-hd="${esc(x.d)}">✕</button></div>`).join("")+`</details>`:"";
  return `<div class="card"><div class="row sp"><b>${esc(p.name)}</b><button class="g" data-edit="${esc(p.id)}">Modifica</button></div>`
  +(p.ean?`<div class="mono mu">EAN ${esc(p.ean)}</div>`:"")+(p.targetPrice?`<div class="mu">Obiettivo ${fmt(p.targetPrice)}</div>`:"")+body+hist+`</div>`;
}

function render(){
  const c=S.config;
  $("#time").value=c.time||"08:00";$("#active").checked=c.active!==false;
  $("#cnt").textContent=c.products.length;$("#add").disabled=c.products.length>=5;
  $("#list").innerHTML=c.products.map(card).join("")||'<div class="mu">Nessun prodotto.</div>';
  const u=S.usage||{};
  const est=c.products.reduce((a,x)=>a+1+(x.sources?.compare!==false?1:0)+(x.sources?.amazon===true?1:0)+(x.sources?.web===true?1:0),0)*30;
  $("#usage").innerHTML=`SerpApi: ${u.serpapi||0}/${S.limits.serpapi} questo mese${S.providers.serpapi?"":" (chiave mancante)"}<br>${S.providers.serper?`Serper (riserva): ${u.serper||0} usate in totale<br>`:""}Consumo stimato: ${est} ricerche/mese${est>S.limits.serpapi?' <span class="up">⚠ oltre la quota gratuita: togli Amazon/Web da qualche prodotto</span>':""}`;
  $("#pushbtn").textContent=S.hasSub?"Notifiche attive ✓":"Attiva notifiche push";
  if(S.last)msg("Ultimo controllo: "+new Date(S.last.at).toLocaleString("it-IT")+(S.last.pushed?" · push: "+S.last.pushed:""));
}

async function saveConfig(c){const j=await api("config",c);S.config=j.config;render();}

$("#savecfg").onclick=async()=>{try{await saveConfig({...S.config,time:$("#time").value,active:$("#active").checked});msg("Salvato");}catch(e){msg(e.message);}};
$("#checknow").onclick=async e=>{
  if(!S.config.products.length)return msg("Aggiungi un prodotto");
  if(!confirm("Consuma alcune ricerche della quota giornaliera. Continuare?"))return;
  e.target.disabled=true;msg("Ricerca in corso…");
  const before=S.last&&S.last.at;
  try{
    await fetch("/.netlify/functions/check-background",{method:"POST",headers:{"content-type":"application/json","x-key":(localStorage.getItem("pw_key")||"").trim()},body:"{}"});
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,3000));
      S=await api("state");
      if((S.last&&S.last.at)!==before){render();break;}
      if(i===39)msg("Ricerca ancora in corso: ricarica la pagina tra poco.");
    }
  }catch(x){msg(x.message);}
  e.target.disabled=false;
};

// dialog
function open(id){
  editing=id;const p=S.config.products.find(x=>x.id===id)||{};
  $("#dt").textContent=id==="new"?"Nuovo prodotto":"Modifica prodotto";
  $("#f_name").value=p.name||"";$("#f_ean").value=p.ean||"";$("#f_ex").value=(p.exclude||[]).join(", ");
  $("#f_min").value=p.minPrice||"";$("#f_tg").value=p.targetPrice||"";$("#f_tr").checked=!!p.onlyTrusted;$("#f_cmp").checked=p.sources?p.sources.compare!==false:true;$("#f_am").checked=!!(p.sources&&p.sources.amazon);$("#f_web").checked=!!(p.sources&&p.sources.web);
  $("#cands").innerHTML="";$("#del").style.visibility=id==="new"?"hidden":"visible";$("#dlg").showModal();
}
$("#add").onclick=()=>open("new");
$("#list").onclick=async e=>{
  const t=e.target,ds=t.dataset;
  if(ds.edit)return open(ds.edit);
  try{
    if(ds.fp){
      const o=(S.last.results.find(x=>x.id===ds.fp)||{}).offers[ds.oi];
      if(o&&confirm("Segnalare come falso positivo? Verrà escluso da ora e rimosso dallo storico."))await api("flag",{id:ds.fp,shop:o.shop,title:o.title}),await load();
    }else if(ds.hp){
      if(confirm("Eliminare questo punto dallo storico? Se è un falso positivo verrà escluso anche in futuro."))await api("flag",{id:ds.hp,d:ds.hd}),await load();
    }
  }catch(x){msg(x.message);}
};
$("#cancel").onclick=()=>$("#dlg").close();
$("#ident").onclick=async()=>{
  const q=$("#f_ean").value.trim()||$("#f_name").value.trim();if(!q)return;
  $("#cands").innerHTML='<div class="mu">Ricerca…</div>';
  try{
    const j=await api("identify",{q});
    $("#cands").innerHTML=j.items.length?j.items.map((i,k)=>`<button class="cand" data-k="${k}">${esc(i.title)}<br><span class="mu mono">${esc(i.ean||"")}</span></button>`).join(""):`<div class="mu">${esc(j.note||"Nessun risultato: inserisci nome ed EAN a mano.")}</div>`;
    $("#cands").onclick=e=>{const b=e.target.closest(".cand");if(!b)return;const i=j.items[b.dataset.k];$("#f_name").value=[i.brand,i.model].filter(Boolean).join(" ")||i.title;$("#f_ean").value=i.ean||"";$("#cands").innerHTML="";};
  }catch(e){$("#cands").innerHTML=`<div class="up">${esc(e.message)}</div>`;}
};
$("#save").onclick=async()=>{
  const name=$("#f_name").value.trim();if(!name)return;
  const p={id:editing==="new"?undefined:editing,name,ean:$("#f_ean").value,exclude:$("#f_ex").value.split(",").map(s=>s.trim()).filter(Boolean),minPrice:$("#f_min").value,targetPrice:$("#f_tg").value,onlyTrusted:$("#f_tr").checked,sources:{compare:$("#f_cmp").checked,amazon:$("#f_am").checked,web:$("#f_web").checked}};
  const list=editing==="new"?[...S.config.products,p]:S.config.products.map(x=>x.id===editing?{...x,...p}:x);
  try{await saveConfig({...S.config,products:list});$("#dlg").close();}catch(e){msg(e.message);}
};
$("#del").onclick=async()=>{if(!confirm("Eliminare il prodotto?"))return;try{await saveConfig({...S.config,products:S.config.products.filter(x=>x.id!==editing)});$("#dlg").close();}catch(e){msg(e.message);}};

$("#resetkey").onclick=()=>{localStorage.removeItem("pw_key");location.reload();};

// push
const b64=s=>{const p="=".repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)));};
$("#pushbtn").onclick=async()=>{
  try{
    if(!S)return msg("Dati non caricati: ricarica la pagina");
    if(!S.vapid)return msg("Chiave VAPID mancante su Netlify");
    if(await Notification.requestPermission()!=="granted")return msg("Permesso negato");
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(S.vapid)});
    await api("sub",{subscription:sub.toJSON()});S.hasSub=true;render();msg("Notifiche attivate");
  }catch(e){msg(e.message);}
};
$("#testpush").onclick=async()=>{try{msg("Test: "+(await api("test-push",{})).result);}catch(e){msg(e.message);}};

if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
load();
</script></body></html>
